
App\Entity\Measurement:
    properties:
        location:
            - NotNull:
                  message: 'Wybierz lokalizację.'
                  groups: ['create', 'edit']

        date:
            - NotNull:
                  message: 'Data pomiaru jest wymagana.'
                  groups: ['create', 'edit']

        temperature:
            - NotBlank:
                  message: 'Temperatura jest wymagana.'
                  groups: ['create', 'edit']
            - Range:
                  min: -90
                  max: 60
                  groups: ['create', 'edit']

        humidity:
            - NotBlank:
                  message: 'Wilgotność jest wymagana.'
                  groups: ['create', 'edit']
            - Range:
                  min: 0
                  max: 100
                  groups: ['create', 'edit']

        cloudCover:
            - NotBlank:
                  message: 'Zachmurzenie jest wymagane.'
                  groups: ['create', 'edit']
            - Range:
                  min: 0
                  max: 100
                  groups: ['create', 'edit']

        airPressure:
            - NotBlank:
                  message: 'Ciśnienie atmosferyczne jest wymagane.'
                  groups: ['create', 'edit']
            - Range:
                  min: 800
                  max: 1200
                  groups: ['create', 'edit']

        precipitation:
            - NotBlank:
                  message: 'Wartość opadów jest wymagana.'
                  groups: ['create', 'edit']
            - Range:
                  min: 0
                  max: 500
                  groups: ['create', 'edit']
